name: Deploy MkDocs to Azure Web App

on:
  push:
    branches:
      - Dev

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azureportfolio

    steps:
      - uses: actions/checkout@v4

      # 1. Set up Python 3.14 to match your Azure Runtime
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Matched to your App Service

      # 2. Install Dependencies and Build Site
      - name: Build MkDocs
        run: |
          pip install -r requirements.txt
          mkdocs build

      # 3. Login to Azure via OIDC
      - name: 'Az CLI login'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_APP_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4. Deploy the "site" folder to Azure App Service
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'WetzelPortfolio'
          package: 'azureportfolio/site'