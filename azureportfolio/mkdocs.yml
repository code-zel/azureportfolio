site_name: Matt Wetzel - Azure Portfolio
theme:
  name: material
  features:
    - content.code.copy 
    - content.code.annotate
   ####### - navigation.sections
    - navigation.expand
    - content.tabs.link
    - layout.grid 
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode

nav:
  - Home: index.md
  - How this site was made:
    - Overview: projects/overview.md
    - Creating the App Service: projects/appservice.md
    - Creating the Storage Account: projects/storageaccount.md
    - Creating the VNET: projects/vnet.md
    - Setting up GitHub Actions for CI/CD: projects/githubactions.md
    - Initializing the environment using MKDocs: projects/mkdocs.md
    - Configuring Custom Domain and SSL: projects/custom.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details 
  - pymdownx.superfences 
  - pymdownx.emoji: 
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html 